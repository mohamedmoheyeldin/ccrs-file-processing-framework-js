name: Build and publish Windows release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Setup installer
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Configure temporary release paths
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "ccrs-release"
          $publishRoot = Join-Path $workRoot "publish"
          "CCRS_RELEASE_WORK_DIR=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CCRS_PUBLISH_DIR=$publishRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve and validate release metadata
        run: |
          $config = Get-Content -Raw config/app_version.json | ConvertFrom-Json
          $version = [string]$config.version
          $expectedTag = "v$version"
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $expectedTag
          } else {
            $env:GITHUB_REF_NAME
          }

          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' must match config/app_version.json version '$expectedTag'."
          }

          $existingRelease = @(
            gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName |
              ConvertFrom-Json |
              Where-Object { $_.tagName -eq $releaseTag }
          )
          if ($existingRelease.Count -gt 0) {
            throw "GitHub Release '$releaseTag' already exists. Increment config/app_version.json before publishing another release."
          }

          $displayLabel = [string]$config.label
          if ([string]::IsNullOrWhiteSpace($displayLabel)) {
            $displayLabel = $version
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TITLE=CCRS File Processing Framework - $displayLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm test

      - name: Build Setup installer
        run: pnpm run dist

      - name: Verify release output and create checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath $env:CCRS_PUBLISH_DIR -File -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one release executable, but found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Name -notmatch " Setup ") {
            throw "The release executable is not the Setup installer: $($installer.Name)"
          }

          if ($installer.Length -lt 1MB) {
            throw "The Setup installer is unexpectedly small: $($installer.Length) bytes."
          }

          $releaseAssetName = $installer.Name -replace " ", "."
          $releaseAssetPath = Join-Path $env:CCRS_PUBLISH_DIR $releaseAssetName
          Move-Item -LiteralPath $installer.FullName -Destination $releaseAssetPath
          $installer = Get-Item -LiteralPath $releaseAssetPath

          $header = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw "The Setup installer does not have a valid Windows executable header."
          }

          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $env:CCRS_PUBLISH_DIR "SHA256SUMS.txt"
          "$sha256 *$($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ccrs-file-processing-framework-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.CCRS_PUBLISH_DIR }}/*.exe
            ${{ env.CCRS_PUBLISH_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        run: |
          $config = Get-Content -Raw config/app_version.json | ConvertFrom-Json
          $highlights = @($config.releaseNotes | ForEach-Object { "- $_" })
          if ($highlights.Count -eq 0) {
            $highlights = @("- See the automatically generated change list below.")
          }

          $notes = @(
            "## Windows installer",
            "",
            "Download **$env:INSTALLER_NAME** and run it to install the application.",
            "",
            "This release intentionally provides the Setup installer only; portable executables are not generated.",
            "",
            "## Release highlights",
            ""
          ) + $highlights + @(
            "",
            "## Verify the download",
            "",
            "SHA-256: ``$env:INSTALLER_SHA256``",
            "",
            "The same digest is included in **SHA256SUMS.txt**."
          )

          gh release create $env:RELEASE_TAG `
            $env:INSTALLER_PATH `
            "$env:CCRS_PUBLISH_DIR/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes ($notes -join "`n") `
            --generate-notes `
            --latest

          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json url,name,tagName,assets `
            --jq '{url: .url, name: .name, tag: .tagName, assets: [.assets[].name]}'
